[package]
name = "moma_simulation_engine"
authors = ["Neil Crago"]
description = "Synthetic spiral and helix tracks with ground truth, for testing MOMA's moving-axis analysis, plus a ring-consensus cellular automaton"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neil-crago/moma_simulation_engine"
documentation = "https://docs.rs/moma_simulation_engine"
readme = "README.md"
keywords = ["simulation", "moma", "spiral", "helix", "cellular-automata"]
include = [
    "src/*.rs",
    "examples/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
moma = "1.0.0"
